<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FluxForge — Workflow Editor</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <header class="ff-toolbar">
      <span class="ff-toolbar__brand">FluxForge</span>
      <input id="workflow-name" class="ff-toolbar__name" type="text" placeholder="Untitled workflow" />
      <button id="btn-new">New</button>
      <button id="btn-save">Save</button>
      <button id="btn-run" class="ff-toolbar__run">▶ Run</button>
      <button id="btn-credentials">Credentials</button>
      <button id="btn-dead-letter">Dead letters</button>
      <span id="status" class="ff-toolbar__status"></span>
    </header>
    <div class="ff-layout">
      <aside id="palette" class="ff-palette"></aside>
      <main class="ff-canvas-wrap">
        <canvas id="canvas"></canvas>
      </main>
      <aside id="property-panel" class="ff-panel"></aside>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
